# Tests every push and pull request on Windows (the app's only target). Pushing a tag like v1.0.0 also builds
# the standalone app folder with jpackage and attaches it, zipped, to a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: .\gradlew.bat test --console=plain
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Package app
        run: .\gradlew.bat packageApp --console=plain
      - name: Zip app folder
        run: Compress-Archive -Path "build/jpackage/Audio Gear Aggregator" -DestinationPath "AudioGearAggregator-${{ github.ref_name }}-windows.zip"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "AudioGearAggregator-${{ github.ref_name }}-windows.zip" --title "${{ github.ref_name }}" --generate-notes
