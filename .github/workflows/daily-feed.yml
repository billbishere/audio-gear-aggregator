# Every day: reads forum, Reddit and YouTube feeds (no API keys), keeps the threads whose titles name known gear, and
# publishes them with manifest.json to the data branch. Installed apps read that branch for their daily update.
name: Daily feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check out the data branch
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git worktree add data FETCH_HEAD
            git -C data switch -c data
          else
            git worktree add --detach data
            git -C data switch --orphan data
          fi
      - name: Read the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if json=$(gh release view --json tagName,url 2> /dev/null); then
            echo "version=$(jq -r '.tagName | ltrimstr("v")' <<< "$json")" >> "$GITHUB_OUTPUT"
            echo "url=$(jq -r '.url' <<< "$json")" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect today's feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          LATEST_URL: ${{ steps.release.outputs.url }}
        run: |
          args=(-Pdata=data)
          if [ -n "$LATEST_VERSION" ]; then args+=("-PlatestVersion=$LATEST_VERSION" "-PlatestUrl=$LATEST_URL"); fi
          ./gradlew dailyFeed --console=plain "${args[@]}"
      - name: Publish to the data branch
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to publish"; exit 0; fi
          git commit -m "Daily feed $(date -u +%F)"
          git push origin HEAD:data
